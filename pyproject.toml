[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.2.0"
description = "A reusable agent runtime and evaluation harness for reliable enterprise agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
claude = ["anthropic"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
