name: lfm-eval

# One-off cloud run of LFM2.5-2.6B (Q5_K_M, same build as local LM Studio) through both domains.
# Serves the model with Ollama's OpenAI-compatible endpoint on the runner's CPU.
on:
  workflow_dispatch:

jobs:
  lfm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODEL: hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q5_K_M
      OLLAMA_CONTEXT_LENGTH: "8192"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Start Ollama and pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (OLLAMA_CONTEXT_LENGTH=$OLLAMA_CONTEXT_LENGTH ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull "$MODEL"
      - name: Run both domains
        run: |
          mkdir -p lfm
          for d in invoice refund; do
            echo "===== $d"
            python run_eval.py --domain $d --planner lmstudio --model "$MODEL" --base-url http://localhost:11434/v1 2>&1 | tee lfm/$d.txt
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfm-results
          path: |
            lfm/
            ollama.log
